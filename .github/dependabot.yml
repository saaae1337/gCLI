# Зависимости проекта не тянутся из сети — go.mod пуст по замыслу.
# Но обновляются сами гит-хуки экшенов: новый checkout@v5 или setup-go@v6
# может вести себя иначе, и без этого тихо ломается сборка на чужом коммите.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: ci
    labels: [ci]

  # Go-модулей нет, поэтому проверку самих зависимостей запускать нечего.
  # Пустая папка .github убрана из репозитория: dependabot ругается на
  # отсутствующий каталог, а создавать его ради этого — шум.
