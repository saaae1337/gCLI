# Зависимости проекта не тянутся из сети — go.mod пуст по замыслу.
# Но обновляются сами гит-хуки экшенов: новая версия checkout или setup-go
# может вести себя иначе, и без этого тихо ломается сборка на чужом
# коммите. Сейчас стоят checkout@v7, setup-go@v7, upload-artifact@v7
# и action-gh-release@v3.
#
# Коммиты dependabot несут метку ci: без неё в списке коммитов не
# отличить автоматическое обновление от осмысленного правления.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: ci
    labels: [ci]

  # Go-модулей нет, поэтому проверку самих зависимостей запускать нечего.
  # Пустая папка .github убрана из репозитория: dependabot ругается на
  # отсутствующий каталог, а создавать его ради этого — шум.