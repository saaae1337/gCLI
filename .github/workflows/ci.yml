name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  # Новый пуш в ту же ветку отменяет предыдущий прогон: на одно место
  # одновременно не толпимся, экономится минуты CI.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Формат и vet — Linux, где переводы строк не шумят.
  lint:
    name: gofmt + go vet
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: src
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.22"
          # Кэш выключен: setup-go ищет go.sum, которого в проекте нет —
          # зависимостей нет вообще. Ключ не собрать, setup-go пишет
          # «Dependencies file is not found» и ничего не кэширует.
          cache: false

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt требует правки:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

  # Тесты на трёх ОС. Проект живёт на Windows, а пользователи собирают его
  # и на Linux/macOS: расхождения семантики путей (разделители, регистр,
  # права) ловятся только прогоном на всех трёх.
  #
  # macOS закреплён на macos-15, а не на macos-latest, и это не прихоть.
  # Начиная с macOS 26 внутренний линковщик Go собирает Mach-O без команды
  # LC_UUID, и dyld abort'ится на старте бинарника: тесты падают за 0.002с,
  # не выполнив ни одного. Это не наш код — golang/go#75725 и #78012, там же
  # подтверждено, что на macOS 15 всё работает. Ценность macOS-прогона в том,
  # что он ловит расхождения семантики путей, а не дефект линковщика Go.
  # Когда macos-15 устареет, варианта два: перейти на Go 1.26+ (там
  # починили) или оставить внешний линковщик.
  test:
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15]
        # Нижняя граница совместимости — 1.22 (go.mod разрешает 1.21, но
        # CI проверяет то, что реально ставят пользователи сборкой из
        # исходников). Второй колонкой ubuntu на stable: релиз собирается
        # свежим toolchain'ом, и его тесты обязаны идти в CI, а не
        # вслепую.
        go: ["1.22", "stable"]
        exclude:
          - os: windows-latest
            go: "stable"
          - os: macos-15
            go: "stable"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    name: go test (${{ matrix.os }}, ${{ matrix.go }})
    defaults:
      run:
        working-directory: src
        # bash на всех трёх ОС, включая Windows-раннер (там это Git Bash).
        # Нужен один язык сценариев: без него шаг «покажи, что упало»
        # пришлось бы писать трижды и он разъехался бы между ОС.
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
          # Кэш выключен намеренно: setup-go ищет go.sum, которого в проекте
          # нет — зависимостей нет вообще. Без go.sum ключ не собрать,
          # setup-go пишет «Dependencies file is not found» и всё равно
          # ничего не кэширует. Пустой кэш честнее предупреждения.
          cache: false

      # Падение теста на Windows и macOS держалось с октября, и его не
      # было видно нигде, кроме лога, который без прав админа не прочесть.
      # go test печатает названия упавших тестов просто в stdout — GitHub
      # их не подхватывает. Разбираем вывод сами и превращаем строки
      # «--- FAIL» в аннотации: они видны в списке проверок без логов.
      - name: go test
        run: |
          # set +e, а не наоборот: Actions запускает bash с ключом -e, и
          # первая же упавшая команда вышла бы из скрипта раньше, чем мы
          # успеваем показать, что именно упало. Выключаем -e, а выход
          # определяем сами последней строкой.
          set +e
          # -short пропускает браузерные тесты (screenshot): им нужен
          # настоящий headless-браузер, который на раннерах то отсутствует,
          # то падает по памяти, валил весь пакет и с ним Release.
          go test -short ./... -count=1 2>&1 | tee ./ci-test.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            # Сколько строк в логе — само по себе полезно: пустой лог при
            # красном шаге означает, что упало само «go test», а не тест.
            echo "::error title=go test::строк в логе: $(wc -l < ./ci-test.log)"
            # Именно ::error::, а не просто echo: аннотацию создаёт только
            # команда протокола Actions, обычный вывод остаётся в логе и
            # без открытия лога не виден вообще. Проценты и CR экранируются
            # по правилам протокола, иначе строка вырежется по этим символам.
            #
            # Берём весь вывод целиком, а не только строки с «--- FAIL»:
            # если тестовый бинарник падает на старте, «--- FAIL» не
            # печатается вовсе, и фильтр выбрасывал бы ровно то, что нужно
            # увидеть. Строки «ok» пропускаем — они и так видны как зелёные.
            while IFS= read -r line; do
              clean=$(printf '%s' "$line" | sed -e 's/%/%25/g' -e 's/\r/%0D/g')
              echo "::error title=go test::${clean}"
            done < <(grep -v '^ok[[:space:]]' ./ci-test.log | head -200)
          fi
          exit "$status"

      # Гонки данных ловятся только под -race, и только если тесты
      # действительно пишут в одни счётчики из горутин. Стоит дороже
      # обычного прогона, поэтому гоняем на Linux и Windows: там жил
      # проект, и там они уже находились.
      - name: go test -race
        if: matrix.os != 'macos-15'
        run: go test -short -race -count=1 ./...

      - name: go build
        # Путь в runner.temp, а не /tmp: на Windows-раннере pwsh понимает
        # «/tmp/...» как «C:\tmp\...», и такого каталога там может не быть.
        # Шаг не доходил до этого места — тесты падали раньше, — но после их
        # починки упал бы он.
        run: go build -o "${{ runner.temp }}/gcli-check" .

  # Покрытие: считаем один раз на Linux, результат — артефактом и в отчёт.
  coverage:
    name: покрытие
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: src
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.22"
          cache: false

      # -covermode=atomic обязателен вместе с -race: иначе счётчики
      # обновляются из горутин без синхронизации и профиль «считает не то».
      # Покрытие считаем по всем пакетам одним прогоном, иначе профили
      # разных пакетов нельзя сложить в один отчёт.
      - name: go test -covermode=atomic -coverprofile
        run: |
          go test -short -covermode=atomic -coverprofile=coverage.out -coverpkg=./... ./... -count=1

      - name: Итог по пакетам
        run: go tool cover -func=coverage.out | tail -1

      - name: Краткий отчёт в сводку запуска
        run: |
          echo '### Покрытие' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          go tool cover -func=coverage.out | tail -20 >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Профиль покрытия как артефакт
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: src/coverage.out
          retention-days: 14

  # Fuzz-цели раньше жили только у того, кто сам догадался их запустить,
  # и гнили: падение находилось через месяцы, если вообще находилось.
  # Дым по 12 секунд на цель ловит паники на свежих входах в каждом пуше.
  # -run '^$' отключает обычные тесты: здесь гоняется только фаззи.
  fuzz:
    name: fuzz smoke
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: src
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.22"
          cache: false

      - name: по 12 секунд на цель
        run: |
          set -e
          # Пары «пакет цель»: -fuzz принимает ровно один шаблон за прогон,
          # поэтому цели не смешивают в один вызов.
          for t in \
            "gcli/core FuzzStripJSONC" \
            "gcli/core FuzzMissionNormalize" \
            "gcli/core FuzzParseDur" \
            "gcli/core FuzzOneLineAndTruncateNeverPanic" \
            "gcli/wcwidth FuzzTruncate" \
            "gcli/wcwidth FuzzStringWidth" \
            "gcli/ui FuzzWidthInvariants" \
          ; do
            set -- $t
            echo "::group::$1/$2"
            # Пакет — импорт-путём (gcli/core), а не «./gcli/core»:
            # точка ведёт отсчёт от каталога, а модуль называется gcli.
            go test -run '^$' -fuzz "^$2\$" -fuzztime 12s "$1"
            echo "::endgroup::"
          done

  # Официальный сканер уязвимостей Go: сверяет стандартную библиотеку
  # и модули (в этом репозитории модулей ноль, но stdlib живёт в
  # бинарнике) с базой golang.org/x/vuln.
  #
  # Toolchain — stable, и это не прихоть. Первый же прогон на go1.22.12
  # нашёл девять действующих уязвимостей stdlib (net/http, crypto/tls,
  # crypto/x509): 1.22 старше поддерживаемого окна безопасности Go, и
  # список будет только расти. Сканер обязан смотреть на то, чем проект
  # собирается сейчас, — иначе он сообщает о прошлом, а не о бинарнике.
  # Тестовая матрица ниже тем временем держит 1.22 как нижнюю границу
  # совместимости (go.mod: go 1.21) плюс stable на ubuntu — там же, где
  # собирается релиз.
  vuln:
    name: govulncheck
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: src
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "stable"
          cache: false

      - name: govulncheck ./...
        run: |
          # @latest, а не закреплённая версия: govulncheck разбирает код
          # через x/tools, и старая версия паникует на синтаксисе нового
          # Go («unexpected expr: *ast.KeyValueExpr» на go1.27 от
          # v1.1.4). Джоба уже на stable — значит и сканер свежий.
          go install golang.org/x/vuln/cmd/govulncheck@latest
          "$(go env GOPATH)/bin/govulncheck" ./...
