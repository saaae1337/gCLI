name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    name: go vet + go test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Проект живёт на Windows, а пользователи собирают его и на Linux/macOS.
        # Семантика путей на платформах различается — именно такие расхождения
        # ловит только прогон тестов на обеих ОС (см. cmdguard и dedupePaths).
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: src
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: gofmt (только Linux — на Windows перевод строк шумит)
        if: matrix.os == 'ubuntu-latest'
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt требует правки:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./... -count=1

      - name: go build (бинарник собирается)
        run: go build -o /tmp/gcli-check .
