name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  # Новый пуш в ту же ветку отменяет предыдущий прогон: на одно место
  # одновременно не толпимся, экономится минуты CI.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Формат и vet — Linux, где переводы строк не шумят.
  lint:
    name: gofmt + go vet
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: src
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.22"
          # go.mod без зависимостей, но кэш всё равно ускоряет распаковку
          # тулчейна и компиляцию стандартной библиотеи.
          cache: true

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt требует правки:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

  # Тесты на трёх ОС. Проект живёт на Windows, а пользователи собирают его
  # и на Linux/macOS: расхождения семантики путей (разделители, регистр,
  # права) ловятся только прогоном на всех трёх.
  #
  # macOS закреплён на macos-15, а не на macos-latest, и это не прихоть.
  # Начиная с macOS 26 внутренний линковщик Go собирает Mach-O без команды
  # LC_UUID, и dyld abort'ится на старте бинарника: тесты падают за 0.002с,
  # не выполнив ни одного. Это не наш код — golang/go#75725 и #78012, там же
  # подтверждено, что на macOS 15 всё работает. Ценность macOS-прогона в том,
  # что он ловит расхождения семантики путей, а не дефект линковщика Go.
  # Когда macos-15 устареет, варианта два: перейти на Go 1.26+ (там
  # починили) или оставить внешний линковщик.
  test:
    name: go test (${{ matrix.os }})
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: src
        # bash на всех трёх ОС, включая Windows-раннер (там это Git Bash).
        # Нужен один язык сценариев: без него шаг «покажи, что упало»
        # пришлось бы писать трижды и он разъехался бы между ОС.
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.22"
          # Кэш выключен намеренно: setup-go ищет go.sum, которого в проекте
          # нет — зависимостей нет вообще. Без go.sum ключ не собрать,
          # setup-go пишет «Dependencies file is not found» и всё равно
          # ничего не кэширует. Пустой кэш честнее предупреждения.
          cache: false

      # Падение теста на Windows и macOS держалось с октября, и его не
      # было видно нигде, кроме лога, который без прав админа не прочесть.
      # go test печатает названия упавших тестов просто в stdout — GitHub
      # их не подхватывает. Разбираем вывод сами и превращаем строки
      # «--- FAIL» в аннотации: они видны в списке проверок без логов.
      - name: go test
        run: |
          # set +e, а не наоборот: Actions запускает bash с ключом -e, и
          # первая же упавшая команда вышла бы из скрипта раньше, чем мы
          # успеваем показать, что именно упало. Выключаем -e, а выход
          # определяем сами последней строкой.
          set +e
          go test ./... -count=1 2>&1 | tee ./ci-test.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            # Сколько строк в логе — само по себе полезно: пустой лог при
            # красном шаге означает, что упало само «go test», а не тест.
            echo "::error title=go test::строк в логе: $(wc -l < ./ci-test.log)"
            # Именно ::error::, а не просто echo: аннотацию создаёт только
            # команда протокола Actions, обычный вывод остаётся в логе и
            # без открытия лога не виден вообще. Проценты и CR экранируются
            # по правилам протокола, иначе строка вырежется по этим символам.
            #
            # Берём весь вывод целиком, а не только строки с «--- FAIL»:
            # если тестовый бинарник падает на старте, «--- FAIL» не
            # печатается вовсе, и фильтр выбрасывал бы ровно то, что нужно
            # увидеть. Строки «ok» пропускаем — они и так видны как зелёные.
            while IFS= read -r line; do
              clean=$(printf '%s' "$line" | sed -e 's/%/%25/g' -e 's/\r/%0D/g')
              echo "::error title=go test::${clean}"
            done < <(grep -v '^ok[[:space:]]' ./ci-test.log | head -200)
          fi
          exit "$status"

      # Гонки данных ловятся только под -race, и только если тесты
      # действительно пишут в одни счётчики из горутин. Стоит дороже
      # обычного прогона, поэтому гоняем на Linux и Windows: там жил
      # проект, и там они уже находились.
      - name: go test -race
        if: matrix.os != 'macos-15'
        run: go test -race -count=1 ./...

      - name: go build
        # Путь в runner.temp, а не /tmp: на Windows-раннере pwsh понимает
        # «/tmp/...» как «C:\tmp\...», и такого каталога там может не быть.
        # Шаг не доходил до этого места — тесты падали раньше, — но после их
        # починки упал бы он.
        run: go build -o "${{ runner.temp }}/gcli-check" .

  # Покрытие: считаем один раз на Linux, результат — артефактом и в отчёт.
  coverage:
    name: покрытие
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: src
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.22"
          cache: true

      # -covermode=atomic обязателен вместе с -race: иначе счётчики
      # обновляются из горутин без синхронизации и профиль «считает не то».
      # Покрытие считаем по всем пакетам одним прогоном, иначе профили
      # разных пакетов нельзя сложить в один отчёт.
      - name: go test -covermode=atomic -coverprofile
        run: |
          go test -covermode=atomic -coverprofile=coverage.out -coverpkg=./... ./... -count=1

      - name: Итог по пакетам
        run: go tool cover -func=coverage.out | tail -1

      - name: Краткий отчёт в сводку запуска
        run: |
          echo '### Покрытие' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          go tool cover -func=coverage.out | tail -20 >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Профиль покрытия как артефакт
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: src/coverage.out
          retention-days: 14
