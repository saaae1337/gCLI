# Ревью PR агентом gcli: читает дифф и оставляет комментарий.
# Требуется секрет ZAI_API_KEY — ключ провайдера по умолчанию. Для другого
# провайдера переименуйте переменную (см. *_API_KEY в reference.md) и
# добавьте -provider <id>.
name: gcli review

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    # Ревью не должно блокировать merge: это подсказка, а не контроль.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
        with:
          # Полная история нужна для git diff между ветками.
          fetch-depth: 0

      - name: Установить gcli
        run: |
          # Релиз публикует голые бинарники gcli-<версия>-<os>-<arch>:
          # ни tar.gz, ни каталогов — качаем файл сразу в PATH.
          curl -fsSL -o /usr/local/bin/gcli https://github.com/saaae1337/gCLI/releases/latest/download/gcli-linux-amd64 && chmod +x /usr/local/bin/gcli || true
          # Если релизов ещё нет — собираем из исходников:
          if [ ! -x /usr/local/bin/gcli ]; then
            git clone --depth 1 https://github.com/saaae1337/gCLI.git /tmp/gcli-src
            cd /tmp/gcli-src && ./build.sh one linux amd64
            mv builds/gcli-*-linux-amd64 /usr/local/bin/gcli && chmod +x /usr/local/bin/gcli
          fi

      - name: Дифф PR
        run: git diff origin/${{ github.base_ref }}...HEAD > /tmp/pr.diff

      - name: Ревью агентом
        env:
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
        run: |
          gcli -p "Отревьюй дифф из файла /tmp/pr.diff. Найди: баги, риски безопасности, упрощения. Отвечай по-русски, коротко, по пунктам. Если проблем нет — так и скажи." -json > /tmp/review.md

      - name: Опубликовать комментарий
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr comment ${{ github.event.pull_request.number }} \
            --body "$(cat /tmp/review.md)"
